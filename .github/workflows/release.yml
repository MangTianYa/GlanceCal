name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish, for example 1.0.0 or v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG#refs/tags/}"
            if [[ "$tag" != v* ]]; then
              tag="v$tag"
            fi
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version '$INPUT_TAG'. Use a value such as 1.0.0 or v1.0.0." >&2
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "Signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > calendar-release.jks
          {
            echo "storeFile=calendar-release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build signed APK
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - name: Prepare release asset
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "GlanceCal-${RELEASE_TAG}.apk"
          sha256sum "GlanceCal-${RELEASE_TAG}.apk" > "GlanceCal-${RELEASE_TAG}.apk.sha256"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancecal-release-${{ steps.release.outputs.tag }}
          path: |
            GlanceCal-${{ steps.release.outputs.tag }}.apk
            GlanceCal-${{ steps.release.outputs.tag }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: GlanceCal ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            GlanceCal-${{ steps.release.outputs.tag }}.apk
            GlanceCal-${{ steps.release.outputs.tag }}.apk.sha256
